<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamDoc — Shared Family Keepsake Vault</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  
  <!-- Unified Stylesheets -->
  <link rel="stylesheet" href="/css/style.css">
  
  <!-- Inline Critical Theme Init script to avoid flash of light mode -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('famdoc-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else {
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
      }
    })();
  </script>
</head>
<body>

  <!-- SPA Core Shell Mounting -->
  <div id="famdoc-layout-container" class="ready">
    <div id="view-mount-point"></div>
  </div>

  <!-- Core API Clients -->
  <script src="/js/api.js"></script>
  
  <!-- Background Queue Sync Managers -->
  <script src="/js/background-manager.js"></script>
  
  <!-- SPA Routing Engine & View Managers -->
  <script src="/js/router.js"></script>
  
  <!-- Dynamic View Renders -->
  <script src="/js/views/landing.js"></script>
  <script src="/js/views/auth.js"></script>
  <script src="/js/views/dashboard.js"></script>
  <script src="/js/views/vault.js"></script>
  <script src="/js/views/trash.js"></script>
  <script src="/js/views/profile.js"></script>
  <script src="/js/views/storage.js"></script>
  <script src="/js/views/shared.js"></script>
  <script src="/js/views/family.js"></script>

  <!-- Global Application Orchestration -->
  <script src="/js/app.js"></script>

  <!-- Theme Managers (placed after body elements setup) -->
  <script src="/js/theme.js"></script>

  <!-- SPA Router Bootstrapper Initialization -->
  <script>
    (function() {
      // 1. Register guest-facing public page routes
      window.FamDocRouter.add('/', window.FamDocViews.landing, { guestOnly: true });
      window.FamDocRouter.add('/login', window.FamDocViews.auth.login, { guestOnly: true });
      window.FamDocRouter.add('/register', window.FamDocViews.auth.register, { guestOnly: true });
      window.FamDocRouter.add('/join', window.FamDocViews.auth.join, { guestOnly: true });

      // 2. Register core authenticated workspace routes
      window.FamDocRouter.add('/dashboard', window.FamDocViews.dashboard, { requiresAuth: true });
      window.FamDocRouter.add('/vault', window.FamDocViews.vault, { requiresAuth: true });
      window.FamDocRouter.add('/trash', window.FamDocViews.trash, { requiresAuth: true });
      window.FamDocRouter.add('/family', window.FamDocViews.family, { requiresAuth: true });
      window.FamDocRouter.add('/profile', window.FamDocViews.profile, { requiresAuth: true });
      window.FamDocRouter.add('/storage', window.FamDocViews.storage, { requiresAuth: true });

      // 3. Register standalone shared preview route
      window.FamDocRouter.add('/share/:token', window.FamDocViews.shared, { requiresAuth: false });

      // 4. Resolve the active hash route
      window.FamDocRouter.init();
    })();
  </script>
</body>
</html>
