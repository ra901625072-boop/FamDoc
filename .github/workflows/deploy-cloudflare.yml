name: Deploy to Cloudflare (Workers & Containers)

on:
  push:
    branches:
      - migrate/cloudflare
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloudflare Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  test-and-deploy:
    name: Validate and Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies & Run Tests
        env:
          APP_ENV: development
          JWT_SECRET: test-secret-key-famdoc-ci-suite-9876543210
          STORAGE_CONFIG_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS1mb3ItY2ktZXZhbC1hYmM=
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
          pytest backend/tests/test_redesign.py backend/tests/test_all_14_algorithms.py backend/tests/test_multi_drive_algorithm.py -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Determine Deployment Environment
        id: deploy-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ENV=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "ENV=production" >> $GITHUB_OUTPUT
          else
            echo "ENV=staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Cloudflare (${{ steps.deploy-env.outputs.ENV }})
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy --env ${{ steps.deploy-env.outputs.ENV }}
