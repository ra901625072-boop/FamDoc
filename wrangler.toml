name = "famdoc-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 1. Cloudflare Container Definition
[[containers]]
class_name = "FamDocContainer"
scheduling_policy = "durable_object"

[containers.images.base]
dockerfile = "./backend/Dockerfile"

# 2. Durable Object Binding for Container Lifecycle
[[durable_objects.bindings]]
name = "FAMDOC_CONTAINER"
class_name = "FamDocContainer"

[exports.FamDocContainer]
type = "durable-object"
storage = "sqlite"

# 3. Cloudflare Hyperdrive Binding (Supabase PostgreSQL Edge Pooling)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "famdoc-supabase-hyperdrive-id"

# 4. Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "VAULT_BUCKET"
bucket_name = "famdoc-vault"

# 5. Scheduled Cron Triggers (Nightly 03:00 UTC Retention Purge)
[triggers]
crons = ["0 3 * * *"]

# 6. Global Public Environment Variables
[vars]
APP_ENV = "production"
BACKEND_URL = "https://api.famdoc.com"
FRONTEND_URL = "https://famdoc.vercel.app"
CORS_ORIGINS = "https://famdoc.vercel.app,http://localhost:3000,http://localhost:5173"
MAX_FILE_SIZE_MB = "500"
HEALTH_CHECK_CACHE_TTL = "30"
DASHBOARD_CACHE_TTL = "30"
FOLDER_LISTING_CACHE_TTL = "15"
SEARCH_CACHE_TTL = "10"
DEFAULT_STORAGE_TIER = "r2"

# 7. Staging Environment
[env.staging]
name = "famdoc-backend-staging"
[env.staging.vars]
APP_ENV = "staging"
BACKEND_URL = "https://famdoc-staging.workers.dev"

# 8. Production Environment
[env.production]
name = "famdoc-backend"
routes = [
  { pattern = "api.famdoc.com/*", zone_name = "famdoc.com" }
]
